name: ACP portable

on:
  push:
    branches: [codex/acp-integration]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified ACP build as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: acp-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'CastleYu/openchamber' && github.ref == 'refs/heads/codex/acp-integration'
    runs-on: windows-2022
    env:
      OPENCHAMBER_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Resolve ACP version
        id: identity
        shell: pwsh
        run: |
          $version = node scripts/build-personal.mjs --acp --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check ACP build and publication contracts
        run: node --test scripts/acp-build.test.mjs scripts/publish-acp.test.mjs scripts/build-personal.test.mjs packages/electron/personal-updates.test.mjs
      - name: Test ACP runtime
        run: node --test packages/web/server/lib/acp/runtime.test.js packages/web/server/lib/acp/server-transport.test.js
      - name: Test explicit selection and OpenCode lifecycle
        working-directory: packages/web
        run: bunx vitest run server/lib/opencode/agent-connection.test.js server/lib/opencode/lifecycle.test.js server/lib/opencode/env-runtime.test.js
      - name: Test dual-kernel UI behavior
        run: node scripts/test-dual-kernel.mjs
      - name: Test ACP connection settings
        run: bun test packages/ui/src/lib/agent-connection.test.ts
      - name: Type-check workspace
        run: bun run type-check
      - name: Build ACP portable
        run: node scripts/build-personal.mjs --acp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acp-portable-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            packages/electron/dist/acp/${{ steps.identity.outputs.version }}/OpenChamber-${{ steps.identity.outputs.version }}-win-x64.exe
            packages/electron/dist/acp/${{ steps.identity.outputs.version }}/build-info.json
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'CastleYu/openchamber' && github.ref == 'refs/heads/codex/acp-integration'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acp-portable-${{ github.run_number }}-${{ github.run_attempt }}
          path: packages/electron/dist/acp/${{ needs.build.outputs.version }}
      - name: Publish ACP prerelease
        run: node scripts/publish-acp.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ACP_BUILD_VERSION: ${{ needs.build.outputs.version }}
