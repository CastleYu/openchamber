name: Personal portable

on:
  push:
    branches: [codex/personal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Test personal version and update policy
        run: node --test packages/electron/personal-updates.test.mjs
      - name: Build portable
        run: bun run electron:build
        env:
          OPENCHAMBER_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-portable-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            packages/electron/dist/personal/**/*.exe
            packages/electron/dist/personal/**/build-info.json
          if-no-files-found: error
          retention-days: 30
