name: Personal portable

on:
  push:
    branches: [codex/personal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'CastleYu/openchamber' && github.ref == 'refs/heads/codex/personal'
    runs-on: windows-2022
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Resolve personal version
        id: identity
        shell: pwsh
        run: |
          $version = node scripts/build-personal.mjs --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test personal version and update policy
        run: node --test packages/electron/personal-updates.test.mjs
      - name: Test release publication and update history
        shell: pwsh
        run: |
          node --test scripts/publish-personal.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test packages/ui/src/lib/settings/updateHistory.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run changelog:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable
        run: bun run electron:build
        env:
          OPENCHAMBER_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-portable-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            packages/electron/dist/personal/${{ steps.identity.outputs.version }}/OpenChamber-${{ steps.identity.outputs.version }}-win-x64.exe
            packages/electron/dist/personal/${{ steps.identity.outputs.version }}/build-info.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-portable-${{ github.run_number }}-${{ github.run_attempt }}
          path: packages/electron/dist/personal/${{ needs.build.outputs.version }}
      - name: Publish verified portable release
        run: node scripts/publish-personal.mjs
        env:
          GH_TOKEN: ${{ github.token }}
